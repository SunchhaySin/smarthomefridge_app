name: Build and deploy Flutter web to GitHub Pages

on:
  push:
    branches: 
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write
  
  checks: write
  pull-requests: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  # Job 1: Analyze and build the Flutter web app
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env file from secret
        env:
          APIKEY: ${{ secrets.APIKEY }}
        run: |
          printf 'APIKEY=%s\n' "$APIKEY" > .env

      - name: Clean previous build artifacts
        run: flutter clean
        
      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        run: flutter build web --release --base-href "/${GITHUB_REPOSITORY#*/}/"

      - name: Verify build output
        run: |
          test -f build/web/index.html
          echo "Flutter web build succeeded!"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web/

  # Job 2: Deploy only after a successful build
  deploy:
    runs-on: ubuntu-latest
    needs: build
      
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4