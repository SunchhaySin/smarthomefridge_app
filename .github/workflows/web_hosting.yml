name: Build and deploy Flutter web to Firebase Hosting

on:
  push:
    branches: 
      - main


concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  # Job 1: Analyze and build the Flutter web app
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create .env file from secret
        env:
          APIKEY: ${{ secrets.APIKEY }}
        run: |
          printf 'APIKEY=%s\n' "$APIKEY" > .env

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build web
        run: flutter build web --release

      - name: Verify build output
        run: |
          test -f build/web/index.html
          echo "Flutter web build succeeded!"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: build/web/
          if-no-files-found: error
          retention-days: 1

  # Job 2: Deploy only after a successful build
  deploy:
    runs-on: ubuntu-latest
    needs: build

    if: >-
      needs.build.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository)
      )

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: flutter-web-build
          path: build/web/

      # Pushes to main deploy to the live site
      - name: Deploy to live site (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SMARTHOMEFRIDGE_4A362 }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          channelId: live